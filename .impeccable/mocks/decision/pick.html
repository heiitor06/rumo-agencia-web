<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Placa</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:Arial,sans-serif;background:#1A1A1A;color:#fff;position:relative}
.photo{position:absolute;inset:0;background:linear-gradient(180deg,#7FA9C4 0%,#B9C9A8 50%,#4F6B3A 100%)}
.road{position:absolute;left:0;right:0;bottom:0;height:120px;background:#2A2A2A}
.road:after{content:"";position:absolute;left:0;right:0;top:56px;border-top:8px dashed #F1C21B}
nav{position:absolute;top:0;left:0;right:0;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 56px}
.logo{font-size:30px;font-weight:900}
.links{display:flex;gap:36px;font-size:15px}
.sign{position:absolute;left:56px;top:150px;width:720px;background:#5B3420;border:6px solid #fff;border-radius:14px;padding:32px 36px}
.sign .pic{width:96px;height:96px;border:5px solid #fff;border-radius:10px;margin-bottom:22px}
.sign h1{font-size:96px;line-height:.92;font-weight:700}
.sign .km{display:flex;justify-content:space-between;margin-top:22px;font-size:36px}
.signs{position:absolute;right:56px;top:240px;display:flex;flex-direction:column;gap:16px}
.s{width:420px;height:110px;background:#5B3420;border:4px solid #fff;border-radius:10px;display:flex;align-items:center;padding:0 20px;gap:18px;font-size:30px}
.s i{width:64px;height:64px;border:4px solid #fff;border-radius:8px;display:block}
.cta{position:absolute;left:56px;bottom:170px;background:#0E6B3F;border:5px solid #fff;border-radius:10px;padding:22px 34px;font-size:30px;font-weight:700}
</style></head><body>
<div class="photo"></div><div class="road"></div>
<nav><div class="logo">RUMO</div><div class="links"><span>Destinos</span><span>Pacotes</span><span>Minha reserva</span></div></nav>
<div class="sign"><div class="pic"></div><h1>Chapada<br>Diamantina</h1><div class="km"><span>Lençóis · BA</span><span>→ 7 vagas</span></div></div>
<div class="signs">
 <div class="s"><i></i>Jalapão · TO</div>
 <div class="s"><i></i>Noronha · PE</div>
 <div class="s"><i></i>Serra Gaúcha · RS</div>
</div>
<div class="cta">Ver saídas →</div>
</body></html>
